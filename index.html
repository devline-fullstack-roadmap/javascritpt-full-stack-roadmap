        <h1>Student Management Dashboard</h1>

        <form id="studentForm">

            <input id="nameInput" type="text" placeholder="Student name">

            <input id="ageInput" type="number" placeholder="Age">

            <input id="marksInput" type="number" placeholder="Marks">

            <button type="submit">
                Add Student
            </button>

        </form>

        <p id="message"></p>

        <input id="searchInput" type="text" placeholder="Search student...">

        <ul id="studentList"></ul>

        <section>
            <p>Total Students: <span id="total">0</span></p>
            <p>Passed: <span id="passed">0</span></p>
            <p>Failed: <span id="failed">0</span></p>
        </section>

    </main>
